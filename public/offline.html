<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Sin conexión · AGRO PARTS</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; color: #18181b; text-align: center; }
  .caixa { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; background: #fff; padding: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-top: 20px; }
  p { margin-top: 10px; color: #52525b; line-height: 1.5; font-size: 15px; }
  button { margin-top: 24px; border: 0; border-radius: 12px; background: #2e7d32; color: #fff; font-weight: 700;
    font-size: 16px; padding: 14px 28px; cursor: pointer; }
</style>
</head>
<body>
<div class="caixa">
  <img src="/logo-96.webp" alt="AGRO PARTS">
  <h1 id="t">Sin conexión</h1>
  <p id="x">Revisá la señal o el Wi-Fi. Apenas vuelva internet, la tienda abre de nuevo.</p>
  <button id="b" onclick="location.reload()">Probar de nuevo</button>
</div>
<script>
  // Página em português para quem estava no /pt (ou com o celular em português)
  var pt = /^\/pt(\/|$)/.test(location.pathname) || /^pt/i.test(navigator.language || "");
  if (pt) {
    document.documentElement.lang = "pt-BR";
    document.title = "Sem conexão · AGRO PARTS";
    document.getElementById("t").textContent = "Sem conexão";
    document.getElementById("x").textContent = "Confira o sinal ou o Wi-Fi. Assim que a internet voltar, a loja abre de novo.";
    document.getElementById("b").textContent = "Tentar de novo";
  }
  // Voltou a internet: recarrega sozinho
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
